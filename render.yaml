# Render Blueprint (https://render.com/docs/blueprint-spec), fallback host while
# Azure is not available. Same single-origin setup as Azure: Django + WhiteNoise
# serve the React build, migrations run on startup.

services:
  - type: web
    name: chartit
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    # Vite writes the build to backend/frontend_dist (see frontend/vite.config.ts).
    buildCommand: >-
      cd frontend && npm ci && npm run build &&
      cd ../backend && pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: >-
      cd backend && python manage.py migrate &&
      gunicorn config.wsgi --bind 0.0.0.0:$PORT
    envVars:
      # Match the Dockerfile.
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: chartit-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Host name Render assigned to the service (chartit.onrender.com was taken).
      - key: DJANGO_ALLOWED_HOSTS
        value: chartit-okv1.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://chartit-okv1.onrender.com
      # Free web services have no persistent disk: uploaded files in the default
      # backend/media are lost on every deploy, restart and spin-down.

databases:
  # Free databases expire 30 days after creation (14-day grace period, then deleted).
  - name: chartit-db
    plan: free
    region: frankfurt
    databaseName: chartit
    user: chartit
    # Same major version as docker-compose.yml.
    postgresMajorVersion: "17"
