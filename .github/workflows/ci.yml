# Checks every pull request to main and every push to main (issue #18).
# The job names "frontend" and "backend" are required checks in the main branch ruleset,
# so renaming a job also means updating the ruleset.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Same Node version as render.yaml.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Includes the TypeScript type check (tsc -b).
      - run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    # Tests need PostgreSQL (range types and btree_gist, ADR-03), same major version
    # as docker-compose.yml and render.yaml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: chartit
          POSTGRES_USER: chartit
          POSTGRES_PASSWORD: chartit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chartit -d chartit"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    # Production-like settings, but over plain HTTP so the test client is not redirected.
    env:
      DATABASE_URL: postgres://chartit:chartit@localhost:5432/chartit
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: 'False'
      DJANGO_HTTPS: 'False'

    steps:
      - uses: actions/checkout@v7

      # Same Python version as the Dockerfile and render.yaml.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
