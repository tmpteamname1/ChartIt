# Ruff linter and formatter (https://docs.astral.sh/ruff/). Run from backend/:
#   ruff check --fix .    ruff format .
[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations are generated by Django, so they are not formatted by hand.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Ruff defaults plus import sorting.
extend-select = ["I"]
# Class-level lists are the Django/DRF idiom (Meta.fields, permission_classes, REQUIRED_FIELDS).
ignore = ["RUF012"]

[tool.ruff.format]
quote-style = "single"
